name: finance_tracker
description: "An offline-first personal finance planner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  get_it: ^8.2.0
  go_router: ^16.2.1
  hugeicons: ^1.2.0
  flutter_svg: ^2.2.0
  intl: any
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  sentry_flutter: ^8.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.28.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans.ttf
    - family: RedditMono
      fonts:
        - asset: assets/fonts/RedditMono.ttf
  assets:
    - assets/icons/merchants/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/tilvane-icon-ios.png
  adaptive_icon_background: "#111816"
  adaptive_icon_foreground: assets/brand/adaptive-foreground.png
  remove_alpha_ios: true
  min_sdk_android: 23

flutter_native_splash:
  color: "#F5F6F5"
  color_dark: "#111816"
  image: assets/brand/tilvane-splash-icon-light.png
  image_dark: assets/brand/tilvane-splash-icon-dark.png
  branding: assets/brand/tilvane-branding-light.png
  branding_dark: assets/brand/tilvane-branding-dark.png
  android_12:
    color: "#F5F6F5"
    color_dark: "#111816"
    image: assets/brand/tilvane-splash-icon-light.png
    image_dark: assets/brand/tilvane-splash-icon-dark.png
    branding: assets/brand/tilvane-branding-light.png
    branding_dark: assets/brand/tilvane-branding-dark.png
