name: finance_tracker
description: "An offline-first personal finance planner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  get_it: ^8.2.0
  go_router: ^16.2.1
  hugeicons: ^1.2.0
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.28.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg

# Export assets/logo.svg to a transparent PNG at this path before generating
# platform icons. Keep the symbol centered within the adaptive-icon safe area.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#F8FAFB"
  adaptive_icon_foreground: assets/logo.png
  remove_alpha_ios: true
  min_sdk_android: 23

# The native splash is the branded entry surface before Flutter is ready.
# Export assets/logo.svg to assets/logo.png before running the splash generator.
flutter_native_splash:
  color: "#F8FAFB"
  color_dark: "#11191E"
  image: assets/logo.png
  image_dark: assets/logo.png
  android_12:
    color: "#F8FAFB"
    color_dark: "#11191E"
    image: assets/logo.png
    image_dark: assets/logo.png
